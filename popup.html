<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body { margin: 0; }
      .fg-icon-link { color: #f7931e; }
      .fg-icon-link:hover { color: #c96f00; }
      .fg-btn { background: #ffffff; color: #0b1f3a; }
      .fg-btn:hover { background: #0b1f3a; color: #ffffff; }
      .btn:hover { background: #0b1f3a !important; color: #ffffff !important; }
    </style>
  </head>
  <body>
    <div style="width:320px; font-family: Helvetica, Arial, sans-serif; background:#ffffff; border:1px solid #d7dbe1; border-radius:6px; overflow:hidden; box-shadow:0 4px 14px rgba(20,30,50,0.12);">
      <div style="padding:16px 16px 12px; border-bottom:3px solid #f7931e;">
        <div style="display:flex; align-items:center; gap:6px; line-height:1;">
          <div style="color:#0b1f3a; font-size:15px; font-weight:700; line-height:1;">FastGraphs.com Data Extractor</div>
          <a href="https://github.com/uelel/fastgraphs-data-extractor" target="_blank" rel="noopener noreferrer" class="fg-icon-link" style="display:inline-flex; align-items:center; flex-shrink:0;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </a>
        </div>
        <div style="color:#8b93a1; font-size:11px; margin-top:2px;">Chrome Extension</div>
      </div>
      <div style="padding:12px 16px; background:#f7f8fa; border-bottom:1px solid #eceff2;">
        <div style="color:#8b93a1; font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:600;">Security</div>
        <div style="font-size:13px; margin-top:3px;">
          <span id="securityName" style="color:#0b1f3a; font-weight:700;"></span>&nbsp;
          <span id="securityTicker" style="color:#5b6472; font-weight:600;"></span>
        </div>
      </div>
      <div style="padding:16px; display:flex; flex-direction:column; gap:10px;">
        <button id="extractEPS" class="fg-btn" style="width:100%; padding:10px 12px; border:1.5px solid #0b1f3a; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; text-align:left; transition:background .15s ease, color .15s ease;">
          Extract Earnings per share
        </button>
        <button id="extractDiv" class="fg-btn" style="width:100%; padding:10px 12px; border:1.5px solid #0b1f3a; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; text-align:left; transition:background .15s ease, color .15s ease;">
          Extract Dividends per share
        </button>
        <button id="extractPayoutRatio" class="fg-btn" style="width:100%; padding:10px 12px; border:1.5px solid #0b1f3a; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; text-align:left; transition:background .15s ease, color .15s ease;">
          Extract Dividend Payout ratio
        </button>
      </div>
  </div>
  <script src="popup.js"></script>
</html>
